<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Personal Finance Tracker</h1>
    </header>
    <section class="container">
        <article class="formbox">
            <h2>Add Transactions</h2>
            <form id="financeForm">
                <label>Description</label>
                <input type="text" id="Desc" required>
                <label>Amount</label>
                <input type="number" id="amount" required>
                <label>Date</label>
                 <input type="date" id="date" required>
                 <label>Category</label>
                 <input list="categoryList" id="category" required>
                 <datalist id="categoryList">
                    <option value="food">
                    <option value="shopping">
                    <option value="travel">
                    <option value="salary">
                    <option value="other">
                 </datalist>
                 <button type="button" onclick="AddTransaction()">Add</button>
            </form>
        </article>

        <article class="tablebox">
            <h2>Transactions</h2>
             <table border="1">
            <thead>
                <tr>
                    <th>Description</th>
                    <th>Amount</th>
                    <th>Date</th>
                    <th>Category</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>

        <h3>Total Balance: ₹ <span id="balance">0</span></h3>

        <h3>Savings Goal</h3>
        <progress id="savingProgress" value="0" max="100"></progress>

        <h3>Expense Ratio</h3>
        <meter id="expenseMeter" min="0" max="100" value="0"></meter>

        </article>

        <article>
            <h2>Financial Tips</h2>
            <ol>
                <li>Save 20% of income</li>
                <li>Track daily expenses</li>
                <li>Avoid unnecessary loans</li>
            </ol>
       </article>
    </section>

    <script src="script.js"></script>
</body>
</html>
